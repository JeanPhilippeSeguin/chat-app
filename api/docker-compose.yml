services:
  redis:
    image: redis:8.6.0
    ports:
      - 6379:6379
    command:
      - redis-server
      - --user
      - ${REDIS_USER}
      - on
      - '>${REDIS_PASSWORD}'
      - allcommands
      - allkeys
      - --user
      - default
      - off
    volumes:
      - ./redis:/data
  db:
    image: postgres:18.2
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
